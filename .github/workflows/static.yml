name: Build and deploy static portfolio

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions: {}

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  build:
    if: github.repository == 'r00tK1ngX/my-cv'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Match the locked toolchain
        run: npm install --global npm@11.19.0 --no-audit --no-fund
      - name: Install dependencies from lockfile
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Require fresh static output
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e out || -L out ]]; then
            printf '%s\n' 'Unexpected pre-existing out/; refusing stale output.' >&2
            exit 1
          fi
      - name: Build Next.js static export
        run: npm run build
      - name: Verify all routes, assets and output isolation
        run: |
          npm run verify:export
          node scripts/verify-release.mjs
      - name: Upload only validated static output
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          name: github-pages
          path: out
          retention-days: 1

  deploy:
    if: github.repository == 'r00tK1ngX/my-cv' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read existing Pages configuration
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: false
      - name: Require the existing custom-domain root
        shell: bash
        env:
          PAGES_HOST: ${{ steps.pages.outputs.host }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          set -euo pipefail
          test "$PAGES_HOST" = 'chauanhdung.id.vn'
          test -z "$PAGES_BASE_PATH"
      - name: Deploy the built artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: github-pages
